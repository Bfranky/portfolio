<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blessed Ogobor — Full-Stack Engineer & Next.js Specialist</title>
    <meta name="description" content="Production web platforms, real-time table booking systems, healthcare clinical portals, e-commerce, and SaaS applications by Blessed Ogobor. 24+ live Vercel deployments." />
    
    <!-- OpenGraph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blessed Ogobor — Full-Stack Engineer & Next.js Specialist" />
    <meta property="og:description" content="24+ production web platforms deployed live on Vercel across Healthcare, Dining, EdTech, and Enterprise SaaS." />
    <meta name="theme-color" content="#0a0b0d" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background-color: #0a0b0d;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      /* Custom clean scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f1115;
      }
      ::-webkit-scrollbar-thumb {
        background: #272d38;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
